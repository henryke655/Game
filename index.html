<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Jogo da Velha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Modal de Seleção de Modo -->
    <div class="modal" id="mode-modal">
        <div class="modal-content">
            <div class="logo">🎮</div>
            <h1>Jogo da Velha</h1>
            <p>Escolha o modo de jogo</p>
            
            <div class="mode-buttons">
                <button class="mode-btn" id="solo-btn">
                    <span class="mode-icon">🤖</span>
                    <span class="mode-title">Solo vs IA</span>
                    <span class="mode-desc">Desafie o computador</span>
                </button>
                
                <button class="mode-btn" id="local-btn">
                    <span class="mode-icon">👥</span>
                    <span class="mode-title">Local</span>
                    <span class="mode-desc">2 jogadores, mesmo dispositivo</span>
                </button>
                
                <button class="mode-btn" id="online-btn">
                    <span class="mode-icon">🌐</span>
                    <span class="mode-title">Online</span>
                    <span class="mode-desc">Multiplayer via internet</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal de Login Online -->
    <div class="modal" id="login-modal" style="display:none;">
        <div class="modal-content">
            <div class="logo">🌐</div>
            <h1>Modo Online</h1>
            <p>Conecte-se para jogar</p>
            <input 
                type="text" 
                id="username-input" 
                placeholder="Seu nome de jogador" 
                maxlength="20" 
                autocomplete="off"
            >
            <button class="btn btn-primary" id="start-online-btn">
                🚀 Entrar no Jogo
            </button>
            <button class="btn btn-secondary" id="back-btn">
                ← Voltar
            </button>
        </div>
    </div>

    <!-- Área do Jogo -->
    <div class="container" id="game-area" style="display:none;">
        <header>
            <h1 id="game-title">🎮 Jogo da Velha</h1>
            <div class="user-info">
                <span id="mode-display">Modo: Solo</span>
                <button class="btn-icon" id="menu-btn" title="Menu">☰</button>
            </div>
        </header>

        <!-- Status do Jogo -->
        <div class="status-bar">
            <div class="status" id="status">Vez do <span class="player-x">X</span></div>
        </div>

        <!-- Tabuleiro -->
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <!-- Placar -->
        <div class="scores">
            <div class="score-card">
                <span class="player-x" id="label-x">X</span>
                <span class="score-value" id="score-x">0</span>
            </div>
            <div class="score-card">
                <span class="draw">EMPATE</span>
                <span class="score-value" id="score-draw">0</span>
            </div>
            <div class="score-card">
                <span class="player-o" id="label-o">O</span>
                <span class="score-value" id="score-o">0</span>
            </div>
        </div>

        <!-- Botões -->
        <div class="actions">
            <button class="btn btn-primary" id="reset-btn">🔄 Nova Partida</button>
            <button class="btn btn-secondary" id="back-menu-btn">🏠 Menu</button>
        </div>

        <!-- Stats Online -->
        <div class="online-stats" id="online-stats" style="display:none;">
            <div class="stat-card">
                <span class="stat-value" id="my-elo">1000</span>
                <span class="stat-label">ELO</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="my-wins">0</span>
                <span class="stat-label">Vitórias</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="my-streak">0</span>
                <span class="stat-label">Sequência</span>
            </div>
        </div>

        <!-- Top 10 Online -->
        <div class="leaderboard" id="leaderboard" style="display:none;">
            <h3>🏆 Top 10 Global</h3>
            <div class="leaderboard-list" id="leaderboard-list"></div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="game.js"></script>
</body>
</html>
